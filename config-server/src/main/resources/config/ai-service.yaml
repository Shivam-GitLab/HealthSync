spring:
  application:
    name: ai-service

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/healthsync_ai_recommendation

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${KAFKA_CONSUMER_GROUP:activity-processor-group}
      properties:
        spring.json.trusted.packages: "com.healthsync.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.healthsync.ai.recommendation.entity.Activity

kafka:
  topic:
    name: ${KAFKA_TOPIC:activity-events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:true}

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}

server:
  port: ${SERVER_PORT:8083}

logging:
  level:
    org.springframework: INFO
    com.warenova.wms: DEBUG

  pattern:
    console: "%cyan(%d{HH:mm:ss.SSS}) %green(%-5level) %magenta([%thread]) %blue(%logger{15}) - %msg%n"